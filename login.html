<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Shining Light Academy</title>
<link rel="stylesheet" href="assets/css/styles.css" />
<link rel="icon" type="image/svg+xml" href="assets/images/sla-logo.svg" />
<style>
  /* ============================================================
     LOGIN PAGE — full-bleed building background + glass card
     ============================================================ */
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.55) 50%, rgba(0,0,0,0.75) 100%),
      url('assets/images/sla-building.jpg') center 35% / cover no-repeat fixed;
    color: var(--white);
  }

  .login-card {
    width: 100%;
    max-width: 440px;
    padding: clamp(2.5rem, 5vw, 3.5rem) clamp(2rem, 4vw, 3rem);
    text-align: center;
    border-radius: var(--radius-xl);
    background:
      linear-gradient(135deg, rgba(255,255,255,0.32), rgba(255,255,255,0.16) 50%, rgba(255,255,255,0.22));
    backdrop-filter: blur(60px) saturate(220%) brightness(108%);
    -webkit-backdrop-filter: blur(60px) saturate(220%) brightness(108%);
    border: 1.5px solid rgba(255, 255, 255, 0.42);
    box-shadow:
      inset 0 2px 0 rgba(255, 255, 255, 0.85),
      inset 0 -1px 0 rgba(255, 255, 255, 0.18),
      0 40px 100px rgba(0, 0, 0, 0.4),
      0 12px 32px rgba(0, 0, 0, 0.3);
    color: var(--white);
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: translateY(20px) scale(0.96);
    animation: cardIn 1.2s var(--ease-emphasis) 0.15s forwards;
  }
  .login-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 100% 60% at 30% 0%, rgba(255,255,255,0.35), transparent 55%),
      radial-gradient(ellipse 80% 40% at 80% 100%, rgba(255,255,255,0.12), transparent 50%);
    pointer-events: none;
    border-radius: inherit;
    mix-blend-mode: overlay;
  }
  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .login-card > * { position: relative; z-index: 1; }

  .login-logo {
    width: 88px;
    height: auto;
    margin: 0 auto 1.5rem;
    filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.3));
  }

  .login-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(1.65rem, 3vw, 2rem);
    line-height: 1.15;
    letter-spacing: -0.02em;
    color: var(--white);
    margin-bottom: 0.6rem;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
  }

  .login-sub {
    font-size: 0.95rem;
    color: rgba(255, 255, 255, 0.85);
    margin-bottom: 2rem;
    line-height: 1.5;
  }
  .login-sub strong {
    color: white;
    font-weight: 600;
  }

  .google-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    width: 100%;
    padding: 0.95rem 1.4rem;
    background: white;
    color: #1f1f1f;
    border-radius: 999px;
    font-family: var(--font-text);
    font-size: 0.95rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    transition: all 0.3s var(--ease);
    cursor: pointer;
    border: 1px solid rgba(0, 0, 0, 0.08);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.95),
      0 6px 20px rgba(0, 0, 0, 0.18);
  }
  .google-btn:hover {
    transform: translateY(-1px);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.95),
      0 14px 32px rgba(0, 0, 0, 0.22);
  }
  .google-btn:active { transform: translateY(0); }
  .google-btn:disabled {
    opacity: 0.6;
    cursor: wait;
    transform: none;
  }
  .google-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

  .login-loading {
    margin-top: 1.1rem;
    font-size: 0.82rem;
    color: rgba(255, 255, 255, 0.78);
    display: none;
  }
  .login-loading.visible { display: block; }

  .login-error {
    margin-top: 1.25rem;
    padding: 0.85rem 1.1rem;
    background: rgba(220, 38, 38, 0.92);
    color: white;
    border-radius: 14px;
    font-size: 0.85rem;
    line-height: 1.45;
    display: none;
    border: 1px solid rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(10px);
  }
  .login-error.visible { display: block; }

  .login-fine {
    margin-top: 1.75rem;
    font-size: 0.78rem;
    color: rgba(255, 255, 255, 0.68);
    line-height: 1.55;
  }

  .home-link {
    position: fixed;
    top: 1.5rem;
    left: 1.5rem;
    color: rgba(255, 255, 255, 0.7);
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: -0.005em;
    text-decoration: none;
    transition: color 0.3s var(--ease);
    z-index: 10;
  }
  .home-link:hover { color: white; }
</style>
</head>
<body>

<div class="login-card">
  <img src="assets/images/sla-logo.svg" alt="SLA Crest" class="login-logo" />
  <h1 class="login-title">Welcome back, SLAion.</h1>
  <p class="login-sub">Sign in with your <strong>@slasm.net</strong> Google account to continue.</p>

  <button class="google-btn" id="googleBtn">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    <span>Sign in with Google</span>
  </button>

  <div class="login-loading" id="loading">Redirecting to Google…</div>
  <div class="login-error" id="error" role="alert"></div>

  <p class="login-fine">Only @slasm.net accounts have access. If you don't have one, please contact the school administrator.</p>
</div>

<!-- Supabase JS SDK from CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="src/core/supabase-client.js"></script>

<script>
(async () => {
  // If already signed in, skip the login page
  try {
    const session = await sla.getSession();
    if (session) {
      window.location.replace('./index.html');
      return;
    }
  } catch (e) {
    console.warn('[SLA] Session check failed:', e);
  }

  // Surface any errors from a previous OAuth redirect
  const url = new URL(window.location.href);
  const hash = new URLSearchParams(window.location.hash.substring(1));
  const errorDesc = url.searchParams.get('error_description') || hash.get('error_description');
  const errorCode = url.searchParams.get('error') || hash.get('error');

  if (errorDesc || errorCode) {
    const errEl = document.getElementById('error');
    let msg = decodeURIComponent(errorDesc || errorCode).replace(/\+/g, ' ');
    if (/slasm/i.test(msg)) {
      msg = 'That account is not authorized. Please sign in with a @slasm.net Google account.';
    } else if (/access_denied|cancelled/i.test(msg)) {
      msg = 'Sign-in was cancelled. Click the button below to try again.';
    }
    errEl.textContent = msg;
    errEl.classList.add('visible');
    // Clean URL bar
    history.replaceState({}, document.title, window.location.pathname);
  }
})();

document.getElementById('googleBtn').addEventListener('click', async () => {
  const btn = document.getElementById('googleBtn');
  const loading = document.getElementById('loading');
  const error = document.getElementById('error');

  error.classList.remove('visible');
  btn.disabled = true;
  loading.classList.add('visible');

  try {
    const { error: err } = await sla.signInWithGoogle();
    if (err) {
      error.textContent = err.message || 'Sign-in failed. Please try again.';
      error.classList.add('visible');
      btn.disabled = false;
      loading.classList.remove('visible');
    }
    // If no error, the page is already redirecting to Google.
  } catch (e) {
    error.textContent = 'Could not start sign-in: ' + (e && e.message ? e.message : String(e));
    error.classList.add('visible');
    btn.disabled = false;
    loading.classList.remove('visible');
  }
});
</script>

</body>
</html>
