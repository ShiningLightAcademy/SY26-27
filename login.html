<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Shining Light Academy</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='50' fill='%23142B6F'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='52' font-style='italic' fill='%23FAF6EE' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" />
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: var(--gutter);
    }
    .login-card {
      max-width: 480px;
      width: 100%;
      background: var(--cream);
      border: 1px solid rgba(20, 43, 111, 0.1);
      border-radius: var(--radius-lg);
      padding: clamp(2rem, 5vw, 3.5rem);
      box-shadow: var(--shadow-lg);
      text-align: center;
      position: relative;
      z-index: 2;
    }
    .login-mark {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--ink);
      color: var(--cream);
      display: grid;
      place-items: center;
      font-family: var(--font-display);
      font-style: italic;
      font-size: 1.8rem;
      margin: 0 auto 1.5rem;
    }
    .login-card h1 {
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      margin-bottom: 0.5rem;
    }
    .login-card .login-sub {
      color: var(--ink-mute);
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }
    .login-google {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      justify-content: center;
      padding: 0.95rem 1.5rem;
      background: var(--ink);
      color: var(--cream);
      border-radius: 999px;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all var(--transition);
    }
    .login-google:hover {
      background: var(--sage-deep);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .login-google svg {
      background: white;
      border-radius: 50%;
      padding: 3px;
    }
    .login-note {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(20, 43, 111, 0.1);
      font-size: 0.82rem;
      color: var(--ink-mute);
      line-height: 1.6;
    }
    .login-error {
      background: rgba(160, 82, 45, 0.1);
      color: #7A3E1E;
      border: 1px solid rgba(160, 82, 45, 0.3);
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.88rem;
      text-align: left;
      display: none;
    }
    .login-error.show { display: block; }
    .login-disclaimer {
      font-size: 0.72rem;
      color: var(--ink-mute);
      font-style: italic;
      margin-top: 1.5rem;
      max-width: 36ch;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-mark">S</div>
    <h1>Shining Light Academy</h1>
    <p class="login-sub">SY 2026 — 2027</p>

    <div id="login-error" class="login-error"></div>

    <a href="#" id="google-signin" class="login-google">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      <span>Sign in with Google</span>
    </a>

    <div class="login-note">
      Access is restricted to members of the Shining Light Academy
      community. Please sign in using your <strong>@slasm.net</strong>
      Google account.
    </div>

    <p class="login-disclaimer">
      Personal project by Ralph Ongtangco. Not an official
      Shining Light Academy resource.
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/sla-config.js"></script>
  <script>
    (function () {
      'use strict';

      // ---- guard ----
      if (typeof SLA_SUPABASE_URL === 'undefined' || SLA_SUPABASE_URL.includes('YOUR-PROJECT-REF')) {
        showError('Configuration error: edit js/sla-config.js with your Supabase URL and key.');
        return;
      }

      const client = window.supabase.createClient(SLA_SUPABASE_URL, SLA_SUPABASE_KEY);

      // ---- check if already signed in (returning from OAuth) ----
      (async () => {
        const { data: { session } } = await client.auth.getSession();
        if (session) {
          const email = (session.user.email || '').toLowerCase();
          if (email.endsWith(SLA_ALLOWED_DOMAIN.toLowerCase())) {
            // Already signed in with valid email — go home.
            window.location.replace('index.html');
            return;
          } else {
            // Signed in but wrong domain — sign out, show error.
            await client.auth.signOut();
            showError(
              'Access denied. You signed in with ' + email +
              ', but only ' + SLA_ALLOWED_DOMAIN + ' accounts are allowed.'
            );
          }
        }

        // Show reason from previous redirect, if any.
        try {
          const reason = sessionStorage.getItem('sla-auth-reason');
          if (reason === 'wrong-domain') {
            showError('You signed in with the wrong account. Please use your ' + SLA_ALLOWED_DOMAIN + ' email.');
          } else if (reason === 'signed-out') {
            showError('You have been signed out.');
          }
          sessionStorage.removeItem('sla-auth-reason');
        } catch (e) {}
      })();

      // ---- Google sign in ----
      document.getElementById('google-signin').addEventListener('click', async (e) => {
        e.preventDefault();
        const { error } = await client.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: window.location.origin + window.location.pathname.replace(/[^\/]*$/, '') + 'login.html',
            queryParams: {
              hd: 'slasm.net' // hint to Google to show only slasm.net workspace
            }
          }
        });
        if (error) {
          showError('Sign-in failed: ' + error.message);
        }
      });

      function showError(msg) {
        const el = document.getElementById('login-error');
        el.textContent = msg;
        el.classList.add('show');
      }
    })();
  </script>
</body>
</html>
