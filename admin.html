<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Shining Light Academy</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='50' fill='%23142B6F'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='52' font-style='italic' fill='%23FAF6EE' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" />
  <style>
    /* Admin-specific styles */
    .admin-shell { max-width: 1280px; margin: 0 auto; padding: 2rem var(--gutter) 4rem; }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid rgba(20, 43, 111, 0.12);
    }
    .admin-header h1 { margin-bottom: 0.25rem; }
    .admin-header p { color: var(--ink-mute); font-size: 0.95rem; }

    .admin-tabs {
      display: flex;
      gap: 0.25rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      background: var(--paper);
      padding: 0.4rem;
      border-radius: 999px;
      width: fit-content;
    }
    .admin-tab {
      padding: 0.6rem 1.2rem;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--ink-soft);
      border-radius: 999px;
      cursor: pointer;
      transition: all var(--transition);
      border: none;
      background: transparent;
      font-family: inherit;
    }
    .admin-tab:hover { color: var(--ink); }
    .admin-tab.active { background: var(--ink); color: var(--cream); }
    .admin-tab .count {
      display: inline-block;
      margin-left: 0.4rem;
      padding: 0.05em 0.55em;
      font-size: 0.72rem;
      background: rgba(255,255,255,0.18);
      border-radius: 999px;
    }
    .admin-tab:not(.active) .count {
      background: rgba(20, 43, 111, 0.1);
      color: var(--ink-soft);
    }

    .admin-section { display: none; }
    .admin-section.active { display: block; }
    .admin-section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .admin-section-head h2 { font-size: 1.75rem; }
    .btn-add {
      background: var(--ink);
      color: var(--cream);
      padding: 0.7rem 1.2rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all var(--transition);
      display: inline-flex;
      gap: 0.5rem;
      align-items: center;
    }
    .btn-add:hover { background: var(--sage-deep); transform: translateY(-1px); }

    .admin-form {
      background: var(--paper);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      margin-bottom: 2rem;
      display: none;
    }
    .admin-form.show { display: block; }
    .admin-form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    @media (min-width: 720px) {
      .admin-form-grid.cols-2 { grid-template-columns: 1fr 1fr; }
      .admin-form-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
    }
    .admin-form label {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-mute);
      margin-bottom: 0.4rem;
    }
    .admin-form input,
    .admin-form select,
    .admin-form textarea {
      width: 100%;
      padding: 0.75rem 0.95rem;
      font-family: var(--font-body);
      font-size: 0.95rem;
      background: var(--cream);
      border: 1px solid rgba(20, 43, 111, 0.15);
      border-radius: var(--radius-md);
      color: var(--ink);
      transition: all var(--transition);
    }
    .admin-form input:focus,
    .admin-form select:focus,
    .admin-form textarea:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201, 160, 80, 0.15);
    }
    .admin-form textarea { resize: vertical; min-height: 80px; }
    .admin-form-actions {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }
    .btn-save {
      background: var(--ink);
      color: var(--cream);
      padding: 0.7rem 1.3rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .btn-save:hover { background: var(--sage-deep); }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-cancel {
      padding: 0.7rem 1.3rem;
      border-radius: 999px;
      font-size: 0.9rem;
      color: var(--ink-mute);
    }
    .btn-cancel:hover { color: var(--ink); }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--cream);
      border: 1px solid rgba(20, 43, 111, 0.1);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .admin-table th,
    .admin-table td {
      padding: 0.85rem 1rem;
      text-align: left;
      border-bottom: 1px solid rgba(20, 43, 111, 0.08);
      vertical-align: middle;
      font-size: 0.92rem;
    }
    .admin-table thead {
      background: rgba(20, 43, 111, 0.04);
    }
    .admin-table th {
      font-family: var(--font-body);
      font-weight: 500;
      font-size: 0.74rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-mute);
    }
    .admin-table tbody tr:hover { background: var(--paper); }
    .admin-table tbody tr:last-child td { border-bottom: 0; }
    .admin-table .actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
    }
    .btn-edit, .btn-delete {
      padding: 0.4rem 0.85rem;
      font-size: 0.8rem;
      border-radius: 999px;
      border: 1px solid transparent;
    }
    .btn-edit {
      background: rgba(20, 43, 111, 0.08);
      color: var(--ink);
    }
    .btn-edit:hover { background: rgba(20, 43, 111, 0.15); }
    .btn-delete {
      background: rgba(160, 82, 45, 0.1);
      color: #7A3E1E;
    }
    .btn-delete:hover { background: rgba(160, 82, 45, 0.2); }

    .admin-link {
      color: var(--gold-deep);
      font-weight: 500;
      max-width: 280px;
      display: inline-block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: bottom;
    }
    .admin-link:hover { color: var(--ink); text-decoration: underline; }

    .admin-empty {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--ink-mute);
      font-style: italic;
      background: var(--paper);
      border-radius: var(--radius-lg);
    }

    .admin-toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--ink);
      color: var(--cream);
      padding: 0.95rem 1.3rem;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      font-size: 0.9rem;
      z-index: 100;
      transform: translateY(120%);
      opacity: 0;
      transition: all var(--transition);
    }
    .admin-toast.show { transform: translateY(0); opacity: 1; }
    .admin-toast.error { background: #7A3E1E; }

    /* Messages list */
    .message-card {
      background: var(--cream);
      border: 1px solid rgba(20, 43, 111, 0.1);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .message-meta {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid rgba(20, 43, 111, 0.06);
    }
    .message-from {
      font-family: var(--font-display);
      font-size: 1.05rem;
      color: var(--ink);
    }
    .message-date {
      font-size: 0.8rem;
      color: var(--ink-mute);
    }
    .message-subject {
      font-weight: 500;
      color: var(--gold-deep);
      font-size: 0.88rem;
      margin-bottom: 0.5rem;
    }
    .message-body {
      font-size: 0.92rem;
      color: var(--ink-soft);
      line-height: 1.55;
      white-space: pre-wrap;
    }
    .message-email {
      font-size: 0.82rem;
      color: var(--ink-mute);
      margin-top: 0.5rem;
    }

    /* Access denied screen */
    .denied {
      max-width: 480px;
      margin: 8rem auto;
      text-align: center;
      padding: 0 var(--gutter);
    }
    .denied h1 {
      color: #7A3E1E;
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    .denied p { color: var(--ink-mute); margin-bottom: 1.5rem; }
  </style>
</head>
<body class="auth-pending">

  <!-- Top nav: simplified for admin -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand">
        <span class="nav-brand-mark">S</span>
        <span class="nav-brand-text">
          <strong>SLA Admin</strong>
          <small>Content Management</small>
        </span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">View Site →</a></li>
      </ul>
    </div>
  </nav>

  <!-- Main content (only shown if user is owner) -->
  <div id="admin-shell" class="admin-shell" style="display: none;">

    <header class="admin-header">
      <div>
        <h1>Content Manager</h1>
        <p>Manage classrooms, teachers, schedule, and contact messages.</p>
      </div>
    </header>

    <!-- Tabs -->
    <div class="admin-tabs" role="tablist">
      <button class="admin-tab active" data-section="classrooms">
        Classrooms <span class="count" id="count-classrooms">0</span>
      </button>
      <button class="admin-tab" data-section="teachers">
        Teachers <span class="count" id="count-teachers">0</span>
      </button>
      <button class="admin-tab" data-section="schedule">
        Schedule <span class="count" id="count-schedule">0</span>
      </button>
      <button class="admin-tab" data-section="messages">
        Messages <span class="count" id="count-messages">0</span>
      </button>
    </div>

    <!-- ========== CLASSROOMS SECTION ========== -->
    <section class="admin-section active" id="section-classrooms">
      <div class="admin-section-head">
        <h2>Classrooms</h2>
        <button class="btn-add" data-add="classroom">+ Add Classroom</button>
      </div>

      <form class="admin-form" id="form-classroom">
        <input type="hidden" name="id" />
        <div class="admin-form-grid cols-2">
          <div>
            <label>Subject</label>
            <input type="text" name="subject" placeholder="Mathematics" required />
          </div>
          <div>
            <label>Teacher Name</label>
            <input type="text" name="teacher_name" placeholder="Mr. Cruz" />
          </div>
        </div>
        <div class="admin-form-grid cols-2">
          <div>
            <label>Grade Level / Strand</label>
            <input type="text" name="grade_level" placeholder="Grade 12 — STEM" />
          </div>
          <div>
            <label>Display Order</label>
            <input type="number" name="display_order" value="0" />
          </div>
        </div>
        <div class="admin-form-grid">
          <div>
            <label>Google Classroom Link</label>
            <input type="url" name="classroom_url" placeholder="https://classroom.google.com/c/..." />
          </div>
        </div>
        <div class="admin-form-actions">
          <button type="submit" class="btn-save">Save</button>
          <button type="button" class="btn-cancel" data-cancel="classroom">Cancel</button>
        </div>
      </form>

      <div id="table-classrooms"></div>
    </section>

    <!-- ========== TEACHERS SECTION ========== -->
    <section class="admin-section" id="section-teachers">
      <div class="admin-section-head">
        <h2>Teachers</h2>
        <button class="btn-add" data-add="teacher">+ Add Teacher</button>
      </div>

      <form class="admin-form" id="form-teacher">
        <input type="hidden" name="id" />
        <div class="admin-form-grid cols-2">
          <div>
            <label>Full Name</label>
            <input type="text" name="name" placeholder="Juan dela Cruz" required />
          </div>
          <div>
            <label>Role / Subject</label>
            <input type="text" name="role" placeholder="Mathematics Teacher" required />
          </div>
        </div>
        <div class="admin-form-grid">
          <div>
            <label>Bio (optional)</label>
            <textarea name="bio" placeholder="Brief background, years at SLA, etc."></textarea>
          </div>
        </div>
        <div class="admin-form-grid cols-2">
          <div>
            <label>Photo URL (optional)</label>
            <input type="url" name="photo_url" placeholder="https://..." />
          </div>
          <div>
            <label>Display Order</label>
            <input type="number" name="display_order" value="0" />
          </div>
        </div>
        <div class="admin-form-actions">
          <button type="submit" class="btn-save">Save</button>
          <button type="button" class="btn-cancel" data-cancel="teacher">Cancel</button>
        </div>
      </form>

      <div id="table-teachers"></div>
    </section>

    <!-- ========== SCHEDULE SECTION ========== -->
    <section class="admin-section" id="section-schedule">
      <div class="admin-section-head">
        <h2>Schedule</h2>
        <button class="btn-add" data-add="schedule">+ Add Schedule Entry</button>
      </div>

      <form class="admin-form" id="form-schedule">
        <input type="hidden" name="id" />
        <div class="admin-form-grid cols-3">
          <div>
            <label>Day</label>
            <select name="day_of_week" required>
              <option value="1">Monday</option>
              <option value="2">Tuesday</option>
              <option value="3">Wednesday</option>
              <option value="4">Thursday</option>
              <option value="5">Friday</option>
            </select>
          </div>
          <div>
            <label>Time</label>
            <input type="text" name="time_label" placeholder="8:30 — 9:30" required />
          </div>
          <div>
            <label>Display Order</label>
            <input type="number" name="display_order" value="0" />
          </div>
        </div>
        <div class="admin-form-grid cols-2">
          <div>
            <label>Subject</label>
            <input type="text" name="subject" placeholder="Mathematics" required />
          </div>
          <div>
            <label>Type</label>
            <select name="is_break">
              <option value="false">Regular Class</option>
              <option value="true">Break (Recess/Lunch/Chapel)</option>
            </select>
          </div>
        </div>
        <div class="admin-form-grid">
          <div>
            <label>Google Classroom Link (optional)</label>
            <input type="url" name="classroom_url" placeholder="https://classroom.google.com/c/..." />
          </div>
        </div>
        <div class="admin-form-actions">
          <button type="submit" class="btn-save">Save</button>
          <button type="button" class="btn-cancel" data-cancel="schedule">Cancel</button>
        </div>
      </form>

      <div id="table-schedule"></div>
    </section>

    <!-- ========== MESSAGES SECTION ========== -->
    <section class="admin-section" id="section-messages">
      <div class="admin-section-head">
        <h2>Contact Messages</h2>
      </div>
      <div id="list-messages"></div>
    </section>

  </div>

  <!-- Access denied screen (shown for non-owners) -->
  <div id="denied-screen" class="denied" style="display: none;">
    <h1>Access Denied</h1>
    <p>This page is only available to the site owner. You're signed in as <strong id="denied-email"></strong>.</p>
    <a href="index.html" class="btn btn-ghost">← Back to site</a>
  </div>

  <!-- Toast notifications -->
  <div class="admin-toast" id="admin-toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/sla-config.js"></script>
  <script src="js/sla-auth.js"></script>
  <script src="js/sla-admin.js"></script>
</body>
</html>
